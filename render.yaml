databases:
  - name: carenest-db
    plan: free
    region: oregon
    postgresMajorVersion: 16

services:
  - type: web
    name: carenest
    runtime: python
    plan: free
    region: oregon
    rootDir: Care_Nest
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn Care_Nest.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: carenest.onrender.com,.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://carenest.onrender.com,https://*.onrender.com
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: carenest-db
          property: connectionString
      - key: POSTGRES_SSLMODE
        value: disable
      - key: OMEGA_LLM_BASE_URL
        value: https://llm.c.singularitynet.io/v1
      - key: OMEGA_LLM_MODEL
        value: asi1-mini
      - key: OMEGA_LLM_ENABLED
        value: "true"
      - key: STELLAR_NETWORK
        value: testnet
      - key: STELLAR_RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: STELLAR_HORIZON_URL
        value: https://horizon-testnet.stellar.org
      - key: STELLAR_NETWORK_PASSPHRASE
        value: Test SDF Network ; September 2015
      - key: STELLAR_FRIENDBOT_URL
        value: https://friendbot.stellar.org
      - key: STELLAR_EXPLORER_BASE
        value: https://stellar.expert/explorer/testnet
      - key: CARENEST_TOKEN_CONTRACT_ID
        value: CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC
      - key: CARENEST_TOKEN_SYMBOL
        value: XLM
      - key: CARENEST_TOKEN_DECIMALS
        value: "7"
      - key: CARENEST_FORCE_DEMO_MODE
        value: "false"
      - key: MAP_PROVIDER
        value: leaflet
      - key: CARENEST_PLATFORM_FEE_PERCENT
        value: "5"
      - key: CARENEST_UPSKILLING_RECOVERY_PERCENT
        value: "20"
      - key: PRICE_CACHE_SECONDS
        value: "60"
      - key: PRICE_STALE_SECONDS
        value: "300"
      - key: ASI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: CARTO_API_KEY
        sync: false
      - key: CARENEST_CONTRACT_ID
        sync: false
      - key: STELLAR_DEMO_EMPLOYER_SECRET
        sync: false
      - key: STELLAR_DEMO_WORKER_SECRET
        sync: false
      - key: STELLAR_ARBITER_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
