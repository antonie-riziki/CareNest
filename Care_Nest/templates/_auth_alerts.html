{% if messages %}
<div class="space-y-2 mb-6">
    {% for message in messages %}
    <div class="rounded-xl px-4 py-3 text-sm font-medium {% if message.tags == 'error' %}bg-error-container text-on-error-container{% else %}bg-secondary-container text-on-secondary-container{% endif %}">{{ message }}</div>
    {% endfor %}
</div>
{% endif %}
