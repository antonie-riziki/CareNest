<script>
    function carenestCsrf() {
        const match = document.cookie.match(/csrftoken=([^;]+)/);
        if (match) return decodeURIComponent(match[1]);
        const input = document.querySelector("[name=csrfmiddlewaretoken]");
        return input ? input.value : "";
    }

    function carenestFreighterAvailable() {
        return Boolean(window.freighterApi);
    }

    async function carenestConnectFreighter() {
        if (!carenestFreighterAvailable()) {
            throw new Error("Freighter is not installed. Install the Freighter browser extension, or paste a public key.");
        }
        await window.freighterApi.setAllowed();
        const result = await window.freighterApi.getAddress();
        return result.address || result;
    }

    async function carenestSignXdr(xdr, networkPassphrase) {
        if (!carenestFreighterAvailable()) {
            throw new Error("Freighter is not installed — cannot sign this transaction in the browser.");
        }
        const signed = await window.freighterApi.signTransaction(xdr, { networkPassphrase });
        return signed.signedTxXdr || signed;
    }

    async function carenestPostJson(url, body) {
        const response = await fetch(url, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": carenestCsrf(),
                "X-Requested-With": "fetch",
            },
            body: JSON.stringify(body || {}),
        });
        const data = await response.json().catch(() => ({ ok: false, error: "Unexpected response" }));
        if (!response.ok && !data.needs_signature) {
            throw new Error(data.error || "Request failed");
        }
        return data;
    }

    async function carenestPostForm(url, fields) {
        const form = new FormData();
        Object.entries(fields || {}).forEach(([key, value]) => form.append(key, value));
        const response = await fetch(url, {
            method: "POST",
            headers: {
                "X-CSRFToken": carenestCsrf(),
                "X-Requested-With": "fetch",
            },
            body: form,
        });
        const data = await response.json().catch(() => ({ ok: false, error: "Unexpected response" }));
        if (!response.ok && !data.needs_signature) {
            throw new Error(data.error || "Request failed");
        }
        return data;
    }

    async function carenestRunApproval(approveUrl) {
        const first = await carenestPostForm(approveUrl, {});
        if (first.needs_signature) {
            const signed = await carenestSignXdr(first.xdr, first.network_passphrase);
            return carenestPostJson(first.submit_url, { signed_xdr: signed });
        }
        return first;
    }

    async function carenestGetMetaMask() {
        const announced = await new Promise((resolve) => {
            const found = [];
            const onAnnounce = (event) => found.push(event.detail);
            window.addEventListener("eip6963:announceProvider", onAnnounce);
            window.dispatchEvent(new Event("eip6963:requestProvider"));
            setTimeout(() => {
                window.removeEventListener("eip6963:announceProvider", onAnnounce);
                resolve(found);
            }, 120);
        });
        const announcedMm = announced.find((detail) => {
            const name = (detail.info && detail.info.name) || "";
            return /metamask/i.test(name) || (detail.provider && detail.provider.isMetaMask);
        });
        if (announcedMm && announcedMm.provider) return announcedMm.provider;
        const eth = window.ethereum;
        if (!eth) return null;
        if (Array.isArray(eth.providers)) {
            return eth.providers.find((p) => p.isMetaMask) || eth.providers[0] || null;
        }
        return eth;
    }

    window.carenestWallet = {
        csrf: carenestCsrf,
        connectFreighter: carenestConnectFreighter,
        getMetaMask: carenestGetMetaMask,
        signXdr: carenestSignXdr,
        postJson: carenestPostJson,
        postForm: carenestPostForm,
        runApproval: carenestRunApproval,
        freighterAvailable: carenestFreighterAvailable,
    };
</script>
