<label class="block cursor-pointer">
    <span class="block text-[10px] font-bold uppercase tracking-widest text-outline mb-2">{{ dropzone_label|default:"Primary job image" }}</span>
    <div id="{{ input_id }}-frame" class="relative h-48 w-full rounded-2xl border-2 border-dashed border-primary/50 bg-surface-container-low overflow-hidden flex items-center justify-center">
        <img id="{{ input_id }}-preview" {% if current_url %}src="{{ current_url }}" class="w-full h-full object-cover"{% else %}class="hidden w-full h-full object-cover"{% endif %} alt="Job image preview">
        <div id="{{ input_id }}-empty" class="{% if current_url %}hidden{% endif %} text-center px-4 pointer-events-none">
            <span class="material-symbols-outlined text-5xl text-primary">add_photo_alternate</span>
            <p class="mt-2 text-sm font-bold text-primary">Attach a photo for the job card</p>
            <p class="text-xs text-outline mt-1">JPEG, PNG, or WEBP · max 5 MB</p>
        </div>
    </div>
    <input id="{{ input_id }}" name="{{ input_name|default:'image' }}" type="file" accept="image/jpeg,image/png,image/webp,image/gif" class="mt-3 block w-full text-sm text-primary file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-primary file:text-white file:font-bold file:text-xs file:uppercase file:tracking-widest" onchange="previewDropzone(this, '{{ input_id }}')">
</label>
<script>
function previewDropzone(input, id) {
    const img = document.getElementById(id + "-preview");
    const empty = document.getElementById(id + "-empty");
    if (input.files && input.files[0]) {
        img.src = URL.createObjectURL(input.files[0]);
        img.classList.remove("hidden");
        if (empty) empty.classList.add("hidden");
    }
}
</script>
